name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-dist:
        description: Upload distributions for the release workflow
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.upload-dist }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python "3.13"
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Lint with lintrunner
      uses: justinchuby/lintrunner-action@main

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python_version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install dependencies
        run: |
          pip install -r requirements/ci/requirements.txt
          pip install -e .
      - name: Run tests
        run: |
          pytest --cov=src --cov-report=xml --cov-branch --junitxml junit.xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: justinchuby/onnx-shape-inference

  test-ir-main:
    name: test (upstream IR FLOAT6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install audited upstream IR and released ONNX
        run: |
          pip install -r requirements/ci/requirements.txt -e . \
            "onnx==1.23.2" "onnxruntime==1.31.0" \
            "onnx-ir @ git+https://github.com/onnx/ir-py.git@7c31e12fb31a852e1746f66dc2db5cff905a8ec5"
      - name: Verify FLOAT6 capability
        run: |
          python -c "import onnx_ir as ir; assert all(name in ir.DataType.__members__ for name in ('FLOAT6E2M3', 'FLOAT6E3M2'))"
      - name: Run full suite with FLOAT6 enabled
        run: |
          pytest --cov=src --cov-report=xml --cov-branch --junitxml junit.xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: justinchuby/onnx-shape-inference

  build:
    name: Build
    needs: [test, test-ir-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python build dependencies
        run: |
          pip install build wheel
      - name: Build wheels
        run: |
          python -m build
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        if: inputs.upload-dist
        with:
          name: dist
          path: dist
