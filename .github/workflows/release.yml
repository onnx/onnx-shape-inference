name: Release

on:
  push:
    tags:
      - v*
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A release event must not cancel an in-progress publish for the same tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/main.yml
    with:
      upload-dist: true
    secrets: inherit

  publish:
    name: Publish to PyPI
    needs: ci
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          # Tag pushes and release publication may both publish the same version.
          skip-existing: true
